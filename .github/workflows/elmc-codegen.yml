name: elmc Codegen

on:
  pull_request:
  push:
    branches:
      - main
      - master

env:
  TEST_ULIMIT_V_KB: "6291456"
  ELIXIR_ERL_OPTIONS: "+S 1:1 +MMscs 256"
  XDG_CACHE_HOME: ${{ github.workspace }}/.cache
  ELMC_TEST_COMPILE_CACHE_DIR: ${{ github.workspace }}/.cache/elm-pebble/elmc-test-compile-cache
  ELMC_TEST_IR_CACHE_DIR: ${{ github.workspace }}/.cache/elm-pebble/elmc-test-compile-cache/ir
  ELM_HOME: ${{ github.workspace }}/.elm-home

jobs:
  elmc:
    name: elmc compile, tests, Dialyzer, conformance
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate tracked elm.json files
        run: ./scripts/validate-elm-json.sh

      - name: Fetch optional elm-run corpus
        id: elm-run-corpus
        run: |
          git submodule sync -- vendor/elm-run-test_corpus
          if git submodule update --init --recursive vendor/elm-run-test_corpus; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Optional corpus unavailable::Skipping elm-run corpus gates because vendor/elm-run-test_corpus could not be fetched."
            git submodule deinit -f vendor/elm-run-test_corpus || true
            rm -rf .git/modules/vendor/elm-run-test_corpus vendor/elm-run-test_corpus
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch optional tree-sitter-elm corpus
        id: tree-sitter-corpus
        run: |
          git submodule sync -- vendor/tree-sitter-elm-test-corpus
          if git submodule update --init --recursive vendor/tree-sitter-elm-test-corpus; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Optional corpus unavailable::Skipping tree-sitter corpus gates because vendor/tree-sitter-elm-test-corpus could not be fetched."
            git submodule deinit -f vendor/tree-sitter-elm-test-corpus || true
            rm -rf .git/modules/vendor/tree-sitter-elm-test-corpus vendor/tree-sitter-elm-test-corpus
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3.3"
          elixir-version: "1.20.1"
          version-type: strict
          install-rebar: false
          rebar3-version: "3.24.0"
          hexpm-mirrors: |
            https://builds.hex.pm
            https://cdn.jsdelivr.net/hex

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # elm-tailwind-classes → tailwind-resolver requires node >= 21
          node-version: "22"
          cache: npm
          cache-dependency-path: elm_pebble_dev/package-lock.json

      - name: Cache elm packages
        uses: actions/cache@v4
        with:
          path: ${{ env.ELM_HOME }}
          key: elm-packages-0.19.1-${{ hashFiles('scripts/seed-elm-packages.sh', 'elm_pebble_dev/elm.json') }}
          restore-keys: |
            elm-packages-0.19.1-

      - name: Seed elm packages for cold CI
        run: ./scripts/seed-elm-packages.sh

      - name: Prepare elm_pebble_dev for wasm gate
        run: ./scripts/prepare-elm-pebble-dev-wasm-gate.sh

      - name: Cache mix deps and builds
        uses: actions/cache@v4
        with:
          path: |
            elm_ex/deps
            elm_ex/_build
            elmc/deps
            elmc/_build
            elmx/deps
            elmx/_build
          key: elmc-mix-${{ runner.os }}-otp27.3.3-ex1.20.1-${{ hashFiles('elm_ex/mix.lock', 'elmc/mix.lock', 'elmx/mix.lock') }}-${{ hashFiles('elm_ex/lib/**/*.ex', 'elm_ex/lib/**/*.erl', 'elm_ex/lib/**/*.yrl', 'elmc/lib/**/*.ex', 'elmc/test/support/**/*.ex') }}
          restore-keys: |
            elmc-mix-${{ runner.os }}-otp27.3.3-ex1.20.1-${{ hashFiles('elm_ex/mix.lock', 'elmc/mix.lock', 'elmx/mix.lock') }}-
            elmc-mix-${{ runner.os }}-otp27.3.3-ex1.20.1-

      - name: Cache elmc test compile / IR / host-bin artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELMC_TEST_COMPILE_CACHE_DIR }}
          key: elmc-test-compile-${{ runner.os }}-${{ hashFiles('elm_ex/mix.lock', 'elmc/mix.lock', 'elm_ex/lib/**/*.ex', 'elm_ex/lib/**/*.erl', 'elmc/lib/**/*.ex', 'elmc/test/support/**/*.ex', 'ide/priv/project_templates/**/*.elm', 'packages/elm-pebble/elm-watch/src/**/*.elm', 'shared/elm/**/*.elm') }}
          restore-keys: |
            elmc-test-compile-${{ runner.os }}-

      - name: Install elm_ex dependencies
        working-directory: elm_ex
        run: mix deps.get

      - name: Install elmc dependencies
        working-directory: elmc
        run: mix deps.get

      - name: Install wasm probe Node dependencies
        working-directory: elmc/test/support
        run: npm install --omit=dev --no-audit --no-fund

      - name: Install IDE dependencies (companion protocol generation)
        working-directory: ide
        run: mix do deps.get, compile --no-start

      - name: Compile elmc with warnings as errors
        working-directory: elmc
        run: mix compile --warnings-as-errors

      - name: Prepare elmc test cache dirs
        run: . ./scripts/ci-elmc-test-env.sh

      - name: Run elmc default tests (ulimit + cache)
        run: ./scripts/mix-test-limited.sh elmc

      - name: Run plan gates (per-template batched)
        run: ./scripts/mix-test-plan-gates.sh

      - name: Run 2048 RC integration gates
        run: ./scripts/mix-test-limited.sh elmc --only rc_track_2048

      - name: Run elm-run corpus parity gate
        if: steps.elm-run-corpus.outputs.available == 'true'
        run: ./scripts/mix-test-limited.sh elmc --only corpus_parity

      - name: Run core compliance differential oracle
        run: ./scripts/mix-test-limited.sh elmc test/core_compliance_differential_test.exs --include slow

      - name: Run watchface RC balance smoke
        run: ./scripts/mix-test-per-template.sh test/watchface_rc_track_smoke_test.exs

      - name: Run watchface TEA semantic smoke
        run: ./scripts/mix-test-per-template.sh test/watchface_tea_semantic_smoke_test.exs

      - name: Run elm-run corpus compile gate
        if: steps.elm-run-corpus.outputs.available == 'true'
        run: ./scripts/mix-test-limited.sh elmc --only corpus

      - name: Run elm-run corpus execution gate
        if: steps.elm-run-corpus.outputs.available == 'true'
        run: ./scripts/mix-test-limited.sh elmc --only corpus_run

      - name: Run elm-run corpus elmx compile gate
        if: steps.elm-run-corpus.outputs.available == 'true'
        run: ./scripts/mix-test-limited.sh elmc --only corpus_elmx_smoke

      - name: Run elm-run corpus full elmx compile gate
        if: steps.elm-run-corpus.outputs.available == 'true'
        timeout-minutes: 15
        run: ./scripts/mix-test-limited.sh elmc --only corpus_elmx

      - name: Run fixture codegen dual-backend gate
        run: ./scripts/mix-test-limited.sh elmc --only fixture_codegen

      - name: Run tree-sitter corpus smoke parse gate
        if: steps.tree-sitter-corpus.outputs.available == 'true'
        run: ./scripts/mix-test-limited.sh elm_ex --only ts_corpus_smoke

      - name: Run tree-sitter corpus full parse gate
        if: steps.tree-sitter-corpus.outputs.available == 'true'
        timeout-minutes: 30
        run: ./scripts/mix-test-limited.sh elm_ex --only ts_corpus

      - name: Run wasm web fixture smoke (ulimit)
        run: |
          ./scripts/mix-test-limited.sh elmc \
            test/wasm_web_coverage_test.exs \
            test/wasm_web_wire3_synthetic_test.exs \
            test/wasm_web_route_fetch_test.exs \
            test/wasm_web_strict_sandbox_test.exs \
            test/wasm_web_events_test.exs \
            test/wasm_web_http_test.exs \
            test/wasm_web_multi_route_bytes_test.exs \
            test/wasm_web_elm_pages_nav_test.exs \
            test/plan_web_lowering_gaps_test.exs \
            --include wasm_execute --include wasm_elm_pages_corpus

      - name: Run elm_pebble_dev wasm compile gate (ulimit)
        run: ./scripts/mix-test-limited.sh elmc test/wasm_elm_pebble_dev_gate_test.exs --include slow

      - name: Run elm_ex let layout tests
        run: ./scripts/mix-test-limited.sh elm_ex test/frontend/let_layout_test.exs

      - name: Run elmc Dialyzer
        working-directory: elmc
        run: mix dialyzer

      - name: Run conformance guardrails
        run: bash elmc/scripts/run_conformance_guardrails.sh

  ide-size-report:
    name: IDE compiler size regression gate
    runs-on: ubuntu-latest
    env:
      TEST_ULIMIT_V_KB: "6291456"
      ELIXIR_ERL_OPTIONS: "+S 1:1 +MMscs 256"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3.3"
          elixir-version: "1.20.1"
          version-type: strict
          install-rebar: false
          rebar3-version: "3.24.0"
          hexpm-mirrors: |
            https://builds.hex.pm
            https://cdn.jsdelivr.net/hex

      - name: Install elm_ex dependencies
        working-directory: elm_ex
        run: mix deps.get

      - name: Install elmc dependencies
        working-directory: elmc
        run: mix deps.get

      - name: Install IDE dependencies
        working-directory: ide
        run: mix deps.get

      - name: Compile IDE with warnings as errors
        working-directory: ide
        run: mix compile --warnings-as-errors

      - name: Run size report unit tests
        run: ./scripts/mix-test-limited.sh ide test/ide/size_report_map_path_test.exs

      - name: Check compiler output size against manifest baseline
        working-directory: ide
        run: >
          mix ide.size_report
          --package
          --targets flint
          --templates game-2048,watchface-tangram-time,watchface-yes
          --baseline-manifest priv/size_report_baselines/flint.json
          --fail-on-regression
          --max-bin-regression 512
          > /tmp/size_report.json

      - name: Check size profile compiler output against manifest baseline
        working-directory: ide
        run: >
          mix ide.size_report
          --profile size
          --package
          --targets flint
          --templates watchface-yes,game-2048,watchface-smoke-screen
          --baseline-manifest priv/size_report_baselines/flint-size.json
          --fail-on-regression
          --max-bin-regression 512
          --max-elmc-text-regression 512
          > /tmp/size_report_profile.json

  ide-template-pbw-gate:
    name: IDE template PBW package gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TEST_ULIMIT_V_KB: "6291456"
      ELIXIR_ERL_OPTIONS: "+S 1:1 +MMscs 256"
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
      ELMC_TEST_COMPILE_CACHE_DIR: ${{ github.workspace }}/.cache/elm-pebble/elmc-test-compile-cache
      ELMC_TEST_IR_CACHE_DIR: ${{ github.workspace }}/.cache/elm-pebble/elmc-test-compile-cache/ir
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Pebble toolchain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bzip2 \
            ca-certificates \
            curl \
            git \
            libncurses6 \
            libstdc++6 \
            nodejs \
            npm \
            openssl \
            pipx \
            python3 \
            xz-utils \
            zlib1g

      - name: Set up Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3.3"
          elixir-version: "1.20.1"
          version-type: strict
          install-rebar: false
          rebar3-version: "3.24.0"
          hexpm-mirrors: |
            https://builds.hex.pm
            https://cdn.jsdelivr.net/hex

      - name: Install pebble-tool and Pebble SDK
        run: |
          pipx install pebble-tool
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          rm -rf "$HOME/.pebble-sdk" "$HOME/.pebble" || true
          pebble sdk install latest
          latest_sdk="$(pebble sdk list | awk '/^Available SDKs:/{in_available=1; next} /^Installed SDKs:/{in_available=0} in_available && $1 ~ /^[0-9]/ {last=$1} END {print last}')"
          if [ -z "${latest_sdk}" ]; then
            echo "Could not resolve latest Pebble SDK" >&2
            pebble sdk list >&2
            exit 1
          fi
          pebble sdk install "${latest_sdk}"
          pebble sdk activate "${latest_sdk}"
          if ! pebble sdk list | awk '/\(active\)/ {found=1} END {exit !found}'; then
            echo "No active Pebble SDK after install" >&2
            pebble sdk list >&2
            exit 1
          fi
          pebble sdk list
          echo "PEBBLE_SDK_ROOT=$HOME/.pebble-sdk/SDKs/current" >> "$GITHUB_ENV"

      - name: Install Elm compiler
        run: npm install -g elm@0.19.1-6

      - name: Install elm_ex dependencies
        working-directory: elm_ex
        run: mix deps.get

      - name: Install elmc dependencies
        working-directory: elmc
        run: mix deps.get

      - name: Install IDE dependencies
        working-directory: ide
        run: mix deps.get

      - name: Prepare elmc test cache dirs
        run: . ./scripts/ci-elmc-test-env.sh

      - name: Run template PBW package gate
        env:
          ELMC_TEMPLATE_PBW_GATE: "1"
        run: ./scripts/mix-test-limited.sh ide test/ide/template_pbw_gate_test.exs --only template_pbw_gate

  ide-formatter-gate:
    name: IDE formatter unit and elm-format parity gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3.3"
          elixir-version: "1.20.1"
          version-type: strict
          install-rebar: false
          rebar3-version: "3.24.0"
          hexpm-mirrors: |
            https://builds.hex.pm
            https://cdn.jsdelivr.net/hex

      - name: Install elm-format and fixture fetch tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git nodejs npm
          npm install -g elm-format@0.8.8

      - name: Install elm_ex dependencies
        working-directory: elm_ex
        run: mix deps.get

      - name: Install IDE dependencies
        working-directory: ide
        run: mix deps.get

      - name: Run formatter CI gate
        env:
          TEST_ULIMIT_V_KB: "6291456"
          ELIXIR_ERL_OPTIONS: "+S 1:1 +MMscs 256"
        run: ./scripts/formatter-ci-gate.sh
